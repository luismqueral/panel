# The answers a person gave in intake, for unattended runs of the blog experiment.
intake: 1

situation:
  mode: new
  stack: none
  flavor: vanilla
  users: me
  manages: A personal blog of long-form posts, plus a site settings page.

adapters:
  auth: google-login
  data: json-files
  files: local-disk
  via: server
  mount: standalone

shape:
  collections: true
  singletons: true
  status:
    - draft
    - published
  behavior:
    - Autosave drafts every 10 seconds
    - Show word count under the body field
    - Publishing asks for confirmation

open_questions:
  - question: Does the content folder (./content) go in version control? (recipes/json-files.md step 4)
    assumed: true
    answer: yes, so edits have history
  - question: Do uploads (./uploads) belong in git? (recipes/local-disk.md step 6)
    assumed: true
    answer: no; uploads/ is in .gitignore
  - question: Run the google-login hand checklist with a real OAuth client ID and SESSION_SECRET (recipes/google-login.md section 5)
    assumed: true
    answer: not run; needs the person
