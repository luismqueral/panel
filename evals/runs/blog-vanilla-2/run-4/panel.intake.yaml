# The answers a person gave in intake, for unattended runs of the blog experiment.
intake: 1

situation:
  mode: new
  stack: none
  flavor: vanilla
  users: me
  manages: A personal blog of long-form posts, plus a site settings page.

adapters:
  auth: google-login
  data: json-files
  files: local-disk
  via: server
  mount: standalone

shape:
  collections: true
  singletons: true
  status:
    - draft
    - published
  behavior:
    - Autosave drafts every 10 seconds
    - Show word count under the body field
    - Publishing asks for confirmation

open_questions:
  - question: Does the content folder (./content) go in version control?
    answer: Yes, so edits have history (json-files step 4 default).
    assumed: true
  - question: Do uploads (./uploads) belong in git?
    answer: No. uploads/ is listed in .gitignore (local-disk step 6 default).
    assumed: true
  - question: Run the google-login hand checklist with real credentials.
    answer: Not run. Needs GOOGLE_CLIENT_ID, SESSION_SECRET, and a real Google account.
    assumed: true
