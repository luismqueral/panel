# The answers a person gave in intake, for unattended runs of the blog experiment.
intake: 1

situation:
  mode: new
  stack: none
  flavor: vanilla
  users: me
  manages: A personal blog of long-form posts, plus a site settings page.

adapters:
  auth: google-login
  data: json-files
  files: local-disk
  via: server
  mount: standalone

shape:
  collections: true
  singletons: true
  status:
    - draft
    - published
  behavior:
    - Autosave drafts every 10 seconds
    - Show word count under the body field
    - Publishing asks for confirmation

open_questions:
  - question: Does the content folder (./content) go in version control? (recipes/json-files.md, via server, step 4)
    assumed: true
    answer: yes, so edits have history. Nothing is ignored for it.
  - question: Do uploads (./uploads) belong in git? (recipes/local-disk.md, step 6)
    assumed: true
    answer: no. uploads/ is in .gitignore at the project root.
  - question: Is the public site served by something else, so uploads must be published with it? (recipes/local-disk.md, step 4)
    assumed: true
    answer: no. The project server serves /uploads; path stays ./uploads.
  - question: Who completes the google-login hand checklist with real credentials? (recipes/google-login.md, section 5)
    assumed: true
    answer: the person. Needs a Google OAuth client ID (Web application) with http://localhost:4810 as an authorized origin, GOOGLE_CLIENT_ID and SESSION_SECRET in the environment, then every box in section 5 ticked.
