panel: 1
name: Field Notes

auth:
  recipe: google-login
  allow:
    - me@example.com

data:
  recipe: json-files
  path: ./content

files:
  recipe: local-disk
  path: ./uploads

types:
  - id: post
    label: Posts
    notes: Long-form writing. The editor should feel like a quiet page, not a form.
    behavior: |
      - Autosave drafts every 10 seconds
      - Show word count under the body field
      - Publishing asks for confirmation
    status:
      - draft
      - published
    list:
      title: title
      subtitle: date
      sort: -date
      search:
        - title
    fields:
      - name: title
        type: text
        required: true
        width: 1/1

      - name: slug
        type: slug
        from: title
        width: 1/2

      - name: date
        type: date
        required: true
        width: 1/2

      - name: cover
        type: image
        width: 1/2

      - name: tags
        type: tags
        width: 1/2

      - name: body
        type: markdown
        required: true
        width: 1/1
        behavior: Toolbar hidden until text is selected.

      - name: reading_time
        type: custom
        describe: Read-only. Estimated minutes to read, from the word count of body.
        x-priority: low

singletons:
  - id: settings
    label: Site settings
    fields:
      - name: site_title
        type: text
        required: true

      - name: description
        type: textarea

conformance:
  - Publishing a post requires a cover image.
