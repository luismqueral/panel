panel: 1
name: Sunday Table

notes: A small family recipe site, edited by two sisters. It should feel like a kitchen notebook, not a database. Recipes are the heart of it; the cooks and the About page support them.

auth:
  recipe: password
  password_env: PANEL_PASSWORD

data:
  recipe: json-files
  path: ./content

files:
  recipe: local-disk
  path: ./uploads
  url: /uploads

types:
  - id: recipe
    label: Recipes
    notes: A recipe starts as an idea someone suggests, is tested in the kitchen, is ready to go on the site, and is eventually retired. Retired recipes are kept, not deleted. Only the name is needed for an idea; ingredients and steps are needed before a recipe moves on to testing.
    status:
      - idea
      - testing
      - ready
      - retired
    list:
      title: name
      subtitle: cook
      sort: name
      search:
        - name
    fields:
      - name: name
        type: text
        required: true

      - name: photo
        type: image

      - name: serves
        type: number
        min: 1
        max: 100
        width: 1/3
        help: How many people it serves.

      - name: prep_time
        type: number
        label: Prep time
        min: 0
        width: 1/3
        help: In minutes.

      - name: cook_time
        type: number
        label: Cook time
        min: 0
        width: 1/3
        help: In minutes.

      - name: ingredients
        type: custom
        describe: Rows of an amount and an ingredient, in the order entered. An "Add ingredient" button adds a row, and clearing both boxes of a row removes it. Stored as a list of objects with amount and ingredient.
        required: true
        help: One row per ingredient. Clear a row to remove it.

      - name: steps
        type: textarea
        required: true
        help: One step per line, in order.

      - name: cook
        type: relation
        to: cook
        label: From
        width: 1/2
        help: The family member this recipe comes from.

      - name: favorite
        type: toggle
        default: false
        width: 1/2
        help: Favorites are marked on the site.

  - id: cook
    label: Cooks
    notes: The family members recipes come from.
    list:
      title: name
      sort: name
      search:
        - name
    fields:
      - name: name
        type: text
        required: true

      - name: photo
        type: image
        width: 1/3

      - name: bio
        type: textarea
        width: 2/3
        help: A few sentences.

singletons:
  - id: about
    label: About
    fields:
      - name: title
        type: text
        required: true

      - name: body
        type: markdown
