panel: 1
name: Sunday Table

notes: A small family recipe site, edited by two sisters. It should feel like a shared recipe box, not a database.

auth:
  recipe: password

data:
  recipe: json-files
  path: ./content

files:
  recipe: local-disk
  path: ./uploads
  url: /uploads

types:
  - id: recipe
    label: Recipes
    notes: A recipe starts as an idea someone suggests, gets tested in the kitchen, is ready for the site, and may eventually be retired. Retired recipes are kept, not deleted, so retiring is a status change. Delete is only for mistakes.
    status:
      - idea
      - testing
      - ready
      - retired
    list:
      title: name
      subtitle: cook
      search:
        - name
        - ingredients
    fields:
      - name: name
        type: text
        required: true
        width: 2/3

      - name: favorite
        type: toggle
        default: false
        width: 1/3
        help: Mark a few family favorites.

      - name: photo
        type: image
        width: 1/2

      - name: cook
        type: relation
        to: cook
        label: Comes from
        width: 1/2
        help: The family member this recipe comes from.

      - name: serves
        type: number
        min: 1
        width: 1/3
        help: Number of people.

      - name: prep_time
        type: number
        min: 0
        width: 1/3
        help: In minutes.

      - name: cook_time
        type: number
        min: 0
        width: 1/3
        help: In minutes.

      - name: ingredients
        type: textarea
        required: true
        help: One per line, amount first, like "2 cups flour".

      - name: steps
        type: markdown
        required: true
        help: A numbered list, one step per line.

  - id: cook
    label: Cooks
    notes: The family members recipes come from.
    list:
      title: name
      search:
        - name
    fields:
      - name: name
        type: text
        required: true

      - name: photo
        type: image
        width: 1/3

      - name: bio
        type: textarea
        width: 2/3
        help: A sentence or two.

singletons:
  - id: about
    label: About
    fields:
      - name: title
        type: text
        required: true

      - name: body
        type: markdown

conformance:
  - Retiring a recipe keeps it in the Recipes list.
