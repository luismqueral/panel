intake: 1

# Playback (unattended, treated as confirmed):
# A panel for your family recipe site, Sunday Table, used by you and your sister.
# One shared password, set on the server. Recipes, cooks, and the About page
# stored as JSON files in ./content, photos in ./uploads, written by a small
# Node server. Recipes move from idea to testing to ready to retired; retired
# recipes stay in the panel. Plus one About page.

situation:
  mode: new
  stack: none
  flavor: vanilla
  users: team
  manages: A small family recipe site called Sunday Table. Recipes go through stages, an idea someone suggests, then we test it in the kitchen, then it's ready to go on the site, and eventually some get retired. We keep retired ones, we don't delete them. Each recipe has a name, a photo, how many people it serves, prep time and cook time in minutes, the ingredients with their amounts, the steps, and which family member it comes from. We'd like to mark a few as favorites. We also keep a list of the family cooks, each with a short bio and a photo. And there's one About page.

adapters:
  auth: password
  data: json-files
  files: local-disk
  via: server
  mount: standalone

shape:
  collections: true
  singletons: true
  status:
    - idea
    - testing
    - ready
    - retired
  behavior: []

open_questions:
  - question: New project or existing?
    assumed: false
    answer: New project. The person said so, and the project folder was empty.

  - question: Which flavor?
    assumed: true
    answer: Vanilla, single file (recommended).

  - question: Who will use the panel?
    assumed: false
    answer: A small team (the person and their sister).

  - question: How do people log in?
    assumed: false
    answer: A shared password, in PANEL_PASSWORD on the server.

  - question: Where does the data live?
    assumed: false
    answer: JSON files ("simple files on the computer").

  - question: Where do uploaded files live?
    assumed: false
    answer: Local disk. Recipes and cooks have photos, kept on the computer.

  - question: How should the panel write files?
    assumed: true
    answer: A small Node server in the project (recommended when there is login).

  - question: Where does the panel mount?
    assumed: true
    answer: A standalone page.

  - question: What kinds of content?
    assumed: false
    answer: Both. Recipes and cooks are collections; About is a one-off page.

  - question: Do items have statuses?
    assumed: false
    answer: Custom statuses for recipes, idea, testing, ready, retired. Cooks have no statuses.

  - question: Anything special the panel should do?
    assumed: true
    answer: Nothing beyond the request. Retired recipes are kept, so retiring is a status, not a delete; recorded as notes, not a behavior line.

  - question: Should recipes lose the Delete action, since retired ones are kept?
    assumed: true
    answer: No. Delete stays, as build.md step 4 requires on every item screen. Retiring is the normal way to take a recipe off the site; Delete is for mistakes.

  - question: How should ingredients with their amounts be entered?
    assumed: true
    answer: One textarea, one ingredient per line with the amount first. Panel has no field for a list of structured rows; a custom field would need a proposal.

  - question: Which recipe fields must be filled before a recipe leaves the idea stage?
    assumed: true
    answer: Name, ingredients, and steps. Panel checks required fields on any move past the first status, so the photo stays optional (it is usually taken after testing).

  - question: What does the About page hold?
    assumed: true
    answer: A title (required) and a body in Markdown.

  - question: How should the recipe list be ordered?
    assumed: true
    answer: By name, A to Z (no list sort key), with the cook's name as the subtitle.

  - question: Should publishing (leaving the idea stage) ask for confirmation?
    assumed: true
    answer: No. The person did not ask for it, so there is no behavior line.

  - question: Commit content to git?
    assumed: true
    answer: yes

  - question: Commit uploads to git?
    assumed: true
    answer: no, ./uploads goes in .gitignore
