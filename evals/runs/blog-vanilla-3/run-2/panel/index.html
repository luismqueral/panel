<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Field Notes</title>
  <link rel="stylesheet" href="./styles/tokens.css">
  <link rel="stylesheet" href="./styles/components.css">
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="pn-icon-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="pn-icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="pn-icon-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></symbol>
  <symbol id="pn-icon-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="pn-icon-alert" viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/></symbol>
  <symbol id="pn-icon-chevron-right" viewBox="0 0 24 24"><path d="M10 6l6 6-6 6"/></symbol>
  <symbol id="pn-icon-chevron-down" viewBox="0 0 24 24"><path d="M6 10l6 6 6-6"/></symbol>
  <symbol id="pn-icon-upload" viewBox="0 0 24 24"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5M4 15v4h16v-4"/></symbol>
  <symbol id="pn-icon-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></symbol>
  <symbol id="pn-icon-image" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="1"/><path d="M3.5 16l5-5 4 4 2.5-2.5 5.5 5.5"/></symbol>
  <symbol id="pn-icon-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6.5 7l1 13h9l1-13"/></symbol>
  <symbol id="pn-icon-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
</svg>
<div id="app"></div>
<template data-panel-template="layout">
<div class="pn pn-layout" data-template="layout">
  <a class="pn-skip" href="#pn-main">Skip to content</a>
  <div class="pn-layout-nav" data-slot-children="nav"></div>
  <div class="pn-layout-main">
    <div class="pn-layout-slot" data-slot-children="header"></div>
    <main class="pn-layout-body" id="pn-main" tabindex="-1" data-slot-children="screen"></main>
    <div class="pn-layout-slot" data-slot-children="savebar"></div>
  </div>
  <div class="pn-layout-slot" data-slot-children="dialogs"></div>
  <div class="pn-toasts" aria-live="polite" data-slot-children="toasts"></div>
</div>
</template>
<template data-panel-template="nav">
<nav class="pn-nav" aria-label="Panel" data-template="nav">
  <p class="pn-nav-brand" data-slot="brand"></p>
  <ul class="pn-nav-list" data-slot-repeat="entry">
    <li><a class="pn-nav-link" href="" aria-current="" data-slot-attr="href:href aria-current:current" data-slot="text"></a></li>
  </ul>
  <div class="pn-nav-account-slot" data-slot-children="account"></div>
</nav>
</template>
<template data-panel-template="account">
<div class="pn-nav-account" data-template="account">
  <span class="pn-nav-user" data-slot="user"></span>
  <button class="pn-button" data-variant="quiet" data-size="sm" type="button" data-action="logout">Log out</button>
</div>
</template>
<template data-panel-template="header">
<header class="pn-topbar" data-template="header">
  <nav aria-label="Breadcrumb">
    <ol class="pn-breadcrumb" data-slot-repeat="crumb">
      <li><a href="" aria-current="" data-slot-attr="href:href aria-current:current" data-slot="text"></a></li>
    </ol>
  </nav>
</header>
</template>
<template data-panel-template="savebar">
<div class="pn-savebar" data-state="" data-slot-attr="data-state:save-state" data-template="savebar">
  <p class="pn-savebar-message" role="status" data-slot="message"></p>
  <div class="pn-savebar-actions">
    <span class="pn-spinner" aria-hidden="true"></span>
    <button class="pn-button" data-variant="quiet" type="button" data-action="revert">Revert</button>
    <button class="pn-button" data-variant="primary" type="button" data-action="save">Save</button>
  </div>
</div>
</template>
<template data-panel-template="screen-home">
<section class="pn-screen" data-state="" data-slot-attr="data-state:state" aria-labelledby="pn-screen-title" data-template="screen-home">
  <header class="pn-screen-header">
    <h1 class="pn-screen-title" id="pn-screen-title" data-slot="title"></h1>
  </header>
  <div class="pn-region-loading" role="status"><span class="pn-spinner" aria-hidden="true"></span><span data-slot="loading-text"></span></div>
  <div class="pn-region-ready">
    <div class="pn-home">
      <section aria-labelledby="pn-home-content">
        <h2 class="pn-section-title" id="pn-home-content" data-slot="content-heading"></h2>
        <ul class="pn-list" data-slot-repeat="entry">
          <li class="pn-list-item"><a class="pn-list-row" href="" data-slot-attr="href:href"><span class="pn-list-text"><span class="pn-list-title" data-slot="title"></span><span class="pn-list-subtitle" data-slot="subtitle"></span></span><span class="pn-list-meta" data-slot="meta"></span></a></li>
        </ul>
      </section>
      <section aria-labelledby="pn-home-recent">
        <h2 class="pn-section-title" id="pn-home-recent" data-slot="recent-heading"></h2>
        <ul class="pn-list" data-slot-repeat="recent">
          <li class="pn-list-item"><a class="pn-list-row" href="" data-slot-attr="href:href"><span class="pn-list-text"><span class="pn-list-title" data-slot="title"></span><span class="pn-list-subtitle" data-slot="subtitle"></span></span><span class="pn-list-meta" data-slot="meta"></span></a></li>
        </ul>
      </section>
    </div>
  </div>
  <div class="pn-region-empty" data-slot-children="empty"></div>
  <div class="pn-region-error" data-slot-children="error"></div>
</section>
</template>
<template data-panel-template="screen-collection">
<section class="pn-screen" data-state="" data-type="" data-slot-attr="data-state:state data-type:type-id" aria-labelledby="pn-screen-title" data-template="screen-collection">
  <header class="pn-screen-header">
    <h1 class="pn-screen-title" id="pn-screen-title" data-slot="title"></h1>
    <div class="pn-screen-actions">
      <button class="pn-button" data-variant="primary" type="button" data-action="create"><svg class="pn-icon" aria-hidden="true"><use href="#pn-icon-plus"/></svg><span data-slot="create-label"></span></button>
    </div>
  </header>
  <div class="pn-region-loading" role="status"><span class="pn-spinner" aria-hidden="true"></span><span data-slot="loading-text"></span></div>
  <div class="pn-region-ready">
    <div class="pn-collection-tools" role="search">
      <label class="pn-visually-hidden" for="pn-search" data-slot="search-label"></label>
      <input class="pn-input" type="search" id="pn-search" name="q" placeholder="" data-slot-attr="placeholder:search-placeholder">
      <label class="pn-visually-hidden" for="pn-sort" data-slot="sort-label"></label>
      <select class="pn-select" id="pn-sort" name="sort" data-slot-repeat="sort-option">
        <option value="" data-slot-attr="value:value" data-slot="text"></option>
      </select>
    </div>
    <ul class="pn-list" data-slot-repeat="row">
      <li class="pn-list-item"><a class="pn-list-row" href="" data-slot-attr="href:href"><span class="pn-list-text"><span class="pn-list-title" data-slot="title"></span><span class="pn-list-subtitle" data-slot="subtitle"></span></span><span class="pn-status" data-tone="" data-slot-attr="data-tone:tone" data-slot="status"></span></a></li>
    </ul>
  </div>
  <div class="pn-region-empty" data-slot-children="empty"></div>
  <div class="pn-region-error" data-slot-children="error"></div>
</section>
</template>
<template data-panel-template="screen-item">
<section class="pn-screen" data-state="" data-type="" data-slot-attr="data-state:state data-type:type-id" aria-labelledby="pn-screen-title" data-template="screen-item">
  <header class="pn-screen-header">
    <h1 class="pn-screen-title" id="pn-screen-title" data-slot="title"></h1>
    <div class="pn-screen-actions">
      <button class="pn-status" type="button" data-tone="" data-action="status" data-slot-attr="data-tone:tone"><span class="pn-visually-hidden">Status:</span> <span class="pn-status-text" data-slot="status"></span></button>
    </div>
  </header>
  <div class="pn-region-loading" role="status"><span class="pn-spinner" aria-hidden="true"></span><span data-slot="loading-text"></span></div>
  <div class="pn-region-ready">
    <form class="pn-item" data-kind="collection" novalidate>
      <div class="pn-grid" data-slot-children="fields"></div>
      <aside class="pn-item-sidebar" aria-label="Details">
        <dl class="pn-meta">
          <dt>Created</dt>
          <dd data-slot="created"></dd>
          <dt>Updated</dt>
          <dd data-slot="updated"></dd>
        </dl>
        <button class="pn-button" data-variant="negative" type="button" data-action="delete"><svg class="pn-icon" aria-hidden="true"><use href="#pn-icon-trash"/></svg>Delete</button>
      </aside>
    </form>
  </div>
  <div class="pn-region-empty" data-slot-children="empty"></div>
  <div class="pn-region-error" data-slot-children="error"></div>
</section>
</template>
<template data-panel-template="screen-singleton">
<section class="pn-screen" data-state="" data-singleton="" data-slot-attr="data-state:state data-singleton:singleton-id" aria-labelledby="pn-screen-title" data-template="screen-singleton">
  <header class="pn-screen-header">
    <h1 class="pn-screen-title" id="pn-screen-title" data-slot="title"></h1>
  </header>
  <div class="pn-region-loading" role="status"><span class="pn-spinner" aria-hidden="true"></span><span data-slot="loading-text"></span></div>
  <div class="pn-region-ready">
    <form class="pn-item" data-kind="singleton" novalidate>
      <div class="pn-grid" data-slot-children="fields"></div>
    </form>
  </div>
  <div class="pn-region-error" data-slot-children="error"></div>
</section>
</template>
<template data-panel-template="screen-create">
<dialog class="pn-dialog" aria-labelledby="pn-create-title" data-template="screen-create">
  <form method="dialog" novalidate>
    <div class="pn-dialog-body">
      <h2 class="pn-dialog-title" id="pn-create-title" data-slot="title"></h2>
      <div class="pn-grid" data-slot-children="fields"></div>
    </div>
    <div class="pn-dialog-footer">
      <button class="pn-button" value="cancel" data-action="cancel">Cancel</button>
      <button class="pn-button" data-variant="primary" value="create" data-action="create">Create</button>
    </div>
  </form>
</dialog>
</template>
<template data-panel-template="screen-dialog">
<dialog class="pn-dialog" aria-labelledby="pn-dialog-title" aria-describedby="pn-dialog-text" data-template="screen-dialog">
  <form method="dialog">
    <div class="pn-dialog-body">
      <h2 class="pn-dialog-title" id="pn-dialog-title" data-slot="title"></h2>
      <p class="pn-dialog-text" id="pn-dialog-text" data-slot="text"></p>
    </div>
    <div class="pn-dialog-footer">
      <button class="pn-button" value="cancel" data-action="cancel">Cancel</button>
      <button class="pn-button" data-variant="" value="confirm" data-action="confirm" data-slot-attr="data-variant:variant" data-slot="confirm-label"></button>
    </div>
  </form>
</dialog>
</template>
<template data-panel-template="screen-slide-over">
<dialog class="pn-drawer" aria-labelledby="pn-drawer-title" data-template="screen-slide-over">
  <form class="pn-drawer-form" method="dialog" novalidate>
    <div class="pn-drawer-header">
      <h2 class="pn-drawer-title" id="pn-drawer-title" data-slot="title"></h2>
      <button class="pn-button" data-variant="quiet" data-icon-only data-size="sm" value="close" aria-label="Close" data-action="close"><svg class="pn-icon" aria-hidden="true"><use href="#pn-icon-close"/></svg></button>
    </div>
    <div class="pn-drawer-body" data-slot-children="body"></div>
    <div class="pn-drawer-footer">
      <button class="pn-button" value="cancel" data-action="cancel">Cancel</button>
      <button class="pn-button" data-variant="primary" value="done" data-action="done">Done</button>
    </div>
  </form>
</dialog>
</template>
<template data-panel-template="screen-login">
<main class="pn pn-login" data-template="screen-login">
  <div class="pn-login-card">
    <h1 class="pn-login-title" data-slot="title"></h1>
    <p class="pn-login-text" data-slot="text"></p>
    <div class="pn-login-methods" data-slot-children="methods"></div>
    <p class="pn-error" role="alert" data-slot="error"></p>
  </div>
</main>
</template>
<template data-panel-template="empty">
<div class="pn-empty" data-template="empty">
  <svg class="pn-icon pn-empty-icon" aria-hidden="true"><use href="" data-slot-attr="href:icon"/></svg>
  <p class="pn-empty-title" data-slot="title"></p>
  <p class="pn-empty-text" data-slot="text"></p>
  <div class="pn-empty-actions" data-slot-children="actions"></div>
</div>
</template>
<template data-panel-template="error">
<div class="pn-empty" data-tone="negative" role="alert" data-template="error">
  <svg class="pn-icon pn-empty-icon" aria-hidden="true"><use href="#pn-icon-alert"/></svg>
  <p class="pn-empty-title" data-slot="title"></p>
  <p class="pn-empty-text" data-slot="text"></p>
  <div class="pn-empty-actions" data-slot-children="actions"></div>
</div>
</template>
<template data-panel-template="field-text">
<div class="pn-field" data-field="" data-width="" data-slot-attr="data-field:name data-width:width" data-template="field-text">
  <label class="pn-label" for="" data-required="" data-slot-attr="for:input-id data-required:required" data-slot="label"></label>
  <input class="pn-input" type="text" id="" name="" aria-required="" aria-describedby="" data-slot-attr="id:input-id name:name aria-required:required aria-describedby:describedby">
  <p class="pn-help" id="" data-slot-attr="id:help-id" data-slot="help"></p>
  <p class="pn-error" id="" data-slot-attr="id:error-id" data-slot="error"></p>
</div>
</template>
<template data-panel-template="field-slug">
<div class="pn-field" data-field="" data-width="" data-from="" data-slot-attr="data-field:name data-width:width data-from:from" data-template="field-slug">
  <label class="pn-label" for="" data-required="" data-slot-attr="for:input-id data-required:required" data-slot="label"></label>
  <input class="pn-input" type="text" data-mono spellcheck="false" autocapitalize="off" id="" name="" aria-required="" aria-describedby="" data-slot-attr="id:input-id name:name aria-required:required aria-describedby:describedby">
  <p class="pn-help" id="" data-slot-attr="id:help-id" data-slot="help"></p>
  <p class="pn-error" id="" data-slot-attr="id:error-id" data-slot="error"></p>
</div>
</template>
<template data-panel-template="field-date">
<div class="pn-field" data-field="" data-width="" data-slot-attr="data-field:name data-width:width" data-template="field-date">
  <label class="pn-label" for="" data-required="" data-slot-attr="for:input-id data-required:required" data-slot="label"></label>
  <input class="pn-input" type="" data-mono id="" name="" aria-required="" aria-describedby="" data-slot-attr="type:date-type id:input-id name:name aria-required:required aria-describedby:describedby">
  <p class="pn-help" id="" data-slot-attr="id:help-id" data-slot="help"></p>
  <p class="pn-error" id="" data-slot-attr="id:error-id" data-slot="error"></p>
</div>
</template>
<template data-panel-template="field-image">
<div class="pn-field" data-field="" data-width="" data-state="" data-slot-attr="data-field:name data-width:width data-state:upload-state" data-template="field-image">
  <span class="pn-label" id="" data-required="" data-slot-attr="id:label-id data-required:required" data-slot="label"></span>
  <div class="pn-field-controls">
    <label class="pn-dropzone">
      <svg class="pn-icon" aria-hidden="true"><use href="#pn-icon-upload"/></svg>
      <span data-slot="prompt"></span>
      <input type="file" accept="image/*" id="" name="" aria-labelledby="" aria-describedby="" data-slot-attr="id:input-id name:name aria-labelledby:label-id aria-describedby:describedby">
    </label>
    <div class="pn-file">
      <img class="pn-file-thumb" src="" alt="" data-slot-attr="src:src alt:alt">
      <span class="pn-file-text"><span class="pn-file-name" data-slot="file-name"></span><span class="pn-file-meta" data-slot="file-meta"></span></span>
      <button class="pn-button" data-variant="quiet" data-icon-only data-size="sm" type="button" aria-label="" data-action="remove-file" data-slot-attr="aria-label:remove-label"><svg class="pn-icon" aria-hidden="true"><use href="#pn-icon-trash"/></svg></button>
    </div>
  </div>
  <p class="pn-help" id="" data-slot-attr="id:help-id" data-slot="help"></p>
  <p class="pn-error" id="" data-slot-attr="id:error-id" data-slot="error"></p>
</div>
</template>
<template data-panel-template="field-tags">
<div class="pn-field" data-field="" data-width="" data-slot-attr="data-field:name data-width:width" data-template="field-tags">
  <label class="pn-label" for="" data-required="" data-slot-attr="for:input-id data-required:required" data-slot="label"></label>
  <div class="pn-tags-input">
    <span class="pn-tags-list" data-slot-repeat="tag">
      <span class="pn-tag"><span data-slot="text"></span><button class="pn-tag-remove" type="button" aria-label="" data-action="remove-tag" data-slot-attr="aria-label:remove-label"><svg class="pn-icon" aria-hidden="true"><use href="#pn-icon-close"/></svg></button></span>
    </span>
    <input class="pn-tags-input-field" type="text" id="" name="" aria-required="" aria-describedby="" data-slot-attr="id:input-id name:name aria-required:required aria-describedby:describedby">
  </div>
  <p class="pn-help" id="" data-slot-attr="id:help-id" data-slot="help"></p>
  <p class="pn-error" id="" data-slot-attr="id:error-id" data-slot="error"></p>
</div>
</template>
<template data-panel-template="field-markdown">
<div class="pn-field" data-field="" data-width="" data-slot-attr="data-field:name data-width:width" data-template="field-markdown">
  <label class="pn-label" for="" data-required="" data-slot-attr="for:input-id data-required:required" data-slot="label"></label>
  <div class="pn-toolbar" role="toolbar" aria-label="Formatting">
    <button class="pn-button" data-size="sm" type="button" aria-label="Bold" data-action="bold"><b>B</b></button>
    <button class="pn-button" data-size="sm" type="button" aria-label="Italic" data-action="italic"><i>I</i></button>
    <button class="pn-button" data-size="sm" type="button" aria-label="Heading" data-action="heading">H</button>
    <button class="pn-button" data-size="sm" type="button" aria-label="Link" data-action="link">Link</button>
  </div>
  <textarea class="pn-textarea" data-markdown id="" name="" aria-required="" aria-describedby="" data-slot-attr="id:input-id name:name aria-required:required aria-describedby:describedby"></textarea>
  <p class="pn-help" id="" data-slot-attr="id:help-id" data-slot="help"></p>
  <p class="pn-error" id="" data-slot-attr="id:error-id" data-slot="error"></p>
</div>
</template>
<template data-panel-template="field-custom">
<div class="pn-field" data-field="" data-width="" data-slot-attr="data-field:name data-width:width" data-template="field-custom">
  <span class="pn-label" id="" data-required="" data-slot-attr="id:label-id data-required:required" data-slot="label"></span>
  <div class="pn-field-controls" data-slot-children="control"></div>
  <p class="pn-help" id="" data-slot-attr="id:help-id" data-slot="help"></p>
  <p class="pn-error" id="" data-slot-attr="id:error-id" data-slot="error"></p>
</div>
</template>
<template data-panel-template="field-textarea">
<div class="pn-field" data-field="" data-width="" data-slot-attr="data-field:name data-width:width" data-template="field-textarea">
  <label class="pn-label" for="" data-required="" data-slot-attr="for:input-id data-required:required" data-slot="label"></label>
  <textarea class="pn-textarea" id="" name="" aria-required="" aria-describedby="" data-slot-attr="id:input-id name:name aria-required:required aria-describedby:describedby"></textarea>
  <p class="pn-help" id="" data-slot-attr="id:help-id" data-slot="help"></p>
  <p class="pn-error" id="" data-slot-attr="id:error-id" data-slot="error"></p>
</div>
</template>
<script type="module" src="./panel.js"></script>
</body>
</html>
