<div class="pn-savebar" data-state="" data-slot-attr="data-state:save-state" data-template="savebar">
  <p class="pn-savebar-message" role="status" data-slot="message"></p>
  <div class="pn-savebar-actions">
    <span class="pn-spinner" aria-hidden="true"></span>
    <button class="pn-button" data-variant="quiet" type="button" data-action="revert">Revert</button>
    <button class="pn-button" data-variant="primary" type="button" data-action="save">Save</button>
  </div>
</div>
