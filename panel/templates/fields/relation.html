<div class="pn-field" data-field="" data-width="" data-to="" data-slot-attr="data-field:name data-width:width data-to:to" data-template="field-relation">
  <label class="pn-label" for="" data-required="" data-slot-attr="for:input-id data-required:required" data-slot="label"></label>
  <select class="pn-select" id="" name="" aria-required="" aria-describedby="" data-slot-attr="id:input-id name:name aria-required:required aria-describedby:describedby" data-slot-repeat="option">
    <option value="" data-slot-attr="value:value" data-slot="text"></option>
  </select>
  <p class="pn-help" id="" data-slot-attr="id:help-id" data-slot="help"></p>
  <p class="pn-error" id="" data-slot-attr="id:error-id" data-slot="error"></p>
</div>
