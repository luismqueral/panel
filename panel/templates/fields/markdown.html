<div class="pn-field" data-field="" data-width="" data-slot-attr="data-field:name data-width:width" data-template="field-markdown">
  <label class="pn-label" for="" data-required="" data-slot-attr="for:input-id data-required:required" data-slot="label"></label>
  <div class="pn-toolbar" role="toolbar" aria-label="Formatting">
    <button class="pn-button" data-size="sm" type="button" aria-label="Bold" data-action="bold"><b>B</b></button>
    <button class="pn-button" data-size="sm" type="button" aria-label="Italic" data-action="italic"><i>I</i></button>
    <button class="pn-button" data-size="sm" type="button" aria-label="Heading" data-action="heading">H</button>
    <button class="pn-button" data-size="sm" type="button" aria-label="Link" data-action="link">Link</button>
  </div>
  <textarea class="pn-textarea" data-markdown id="" name="" aria-required="" aria-describedby="" data-slot-attr="id:input-id name:name aria-required:required aria-describedby:describedby"></textarea>
  <p class="pn-help" id="" data-slot-attr="id:help-id" data-slot="help"></p>
  <p class="pn-error" id="" data-slot-attr="id:error-id" data-slot="error"></p>
</div>
